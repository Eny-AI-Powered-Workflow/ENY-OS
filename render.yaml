services:
  - type: web_service
    name: eny-consulting-backend
    env: python
    plan: starter
    region: oregon
    root: backend
    buildCommand: apt-get update && apt-get install -y --no-install-recommends ffmpeg && rm -rf /var/lib/apt/lists/* && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BUSINESS_SUPPORT_ENABLED
        value: "false"
      - key: ENVIRONMENT
        value: "production"
  - type: cron
    name: eny-ghl-contact-reconciliation
    env: python
    plan: starter
    region: oregon
    root: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.scripts.run_ghl_reconciliation
    schedule: "*/10 * * * *"
    envVars:
      - key: GHL_SYNC_API_URL
        sync: false
      - key: GHL_SYNC_CRON_TOKEN
        sync: false
