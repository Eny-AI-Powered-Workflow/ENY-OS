name: Security checks

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend security regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install --disable-pip-version-check -r backend/requirements.txt pytest pytest-asyncio
      - name: Run authentication and request guard tests
        working-directory: backend
        run: |
          python -m pytest -q tests/test_security.py tests/test_request_guard.py

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit Python dependencies
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit frontend dependencies
        run: npm audit --prefix frontend --audit-level=high

  secret-scan:
    name: Scan for committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
